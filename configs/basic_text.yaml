# SCUD text generation config (LM1B with BERT tokenizer)
data:
    data: lm1b
    hf_dataset: dvruette/lm1b
    N: 30522  # BERT vocab size
    tokenizer_name_or_path: bert-base-uncased
    block_size: 1024
    wrap: true

model:
    seed: 0
    model: SCUD
    gamma: 0
    schedule_type: mutual_information
    forward_kwargs:
        type: uniform
    logistic_pars: false
    t_max: 0.999
    restart: false
    n_T: 200

architecture:
    s_dim: 128
    nn_params:
        s_lengthscale: 50
        time_lengthscale: 1
        n_layers: 8
        time_embed_dim: 0
        not_logistic_pars: true
        semb_style: u_inject
        s_embed_dim: 512
        film: true
        input_logits: false
        first_mult: false
    x0_model_class: KingmaUNet
    width: 32

train:
    batch_size: 16
    n_epoch: 1
    lr: 0.0002
    grad_clip_val: 1
    weight_decay: 0
    accumulate: 1
    ema: false
    precision: "32-true"  # Options: "32-true", "16-mixed", "bf16-mixed"

sampling:
    gen_trans_step: 2048

wandb:
    project: scud
