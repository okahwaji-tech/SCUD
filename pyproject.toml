[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scud"
version = "0.1.0"
description = "SCUD: Score-based Continuous-time Unified Diffusion"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "pytorch-lightning>=2.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "wandb>=0.15",
    "einops>=0.6",
    "evodiff",
    "numpy",
    "Pillow",
    "certifi",
    "scipy",
    "faiss-cpu",
]

[project.optional-dependencies]
text = [
    "transformers>=4.30",
    "datasets>=2.14",
    "huggingface_hub>=0.16",
    "tokenizers>=0.13",
    "fsspec",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.scripts]
scud-train = "scud.cli:train"
scud-sample = "scud.cli:sample"
scud-evaluate = "scud.cli:evaluate"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL", "NPY", "PT"]
ignore = [
    "PLR0913",  # Too many arguments — research code has complex constructors
    "PLR2004",  # Magic values in comparisons — acceptable in math-heavy code
    "PLC0415",  # Import not at top level — intentional lazy imports
    "E731",     # Lambda assignment — concise for math expressions
    "PLR0912",  # Too many branches
    "PLR0915",  # Too many statements
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
